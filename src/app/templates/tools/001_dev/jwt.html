<div id="tool-jwt" class="p-6 pt-3 {{ hidden if hidden else '' }}">
    <h2 class="text-2xl font-semibold mb-4 text-blue-600">JWT</h2>
    <div class="container max-w-screen-lg mb-4">
        <div class="flex">
            <!-- Left side: JWT input -->
            <div class="w-1/2 p-4">
                <textarea id="jwt-input" class="w-full h-full p-2 border border-gray-300 rounded"
                    placeholder="Paste your JWT here..."></textarea>
            </div>
            <!-- Right side: JWT parts -->
            <div class="w-1/2 p-4 ml-20">
                <div class="mb-4">
                    <h3 class="text-xl font-semibold text-green-600">Header</h3>
                    <pre id="jwt-header"
                        class="w-full min-h-20 p-2 border border-gray-300 rounded bg-gray-50 overflow-auto text-green-600"></pre>
                </div>
                <div class="mb-4">
                    <h3 class="text-xl font-semibold text-yellow-600">Payload</h3>
                    <pre id="jwt-payload"
                        class="w-full min-h-20 p-2 border border-gray-300 rounded bg-gray-50 overflow-auto text-yellow-600"></pre>
                </div>
                <div>
                    <h3 class="text-xl font-semibold text-red-600">Signature</h3>
                    <pre id="jwt-signature"
                        class="w-full min-h-20 p-2 border border-gray-300 rounded bg-gray-50 overflow-auto text-red-600"></pre>
                </div>
            </div>
        </div>
    </div>
</div>
<script>
    document.getElementById('jwt-input').addEventListener('input', function () {
        const jwt = this.value;
        const parts = jwt.split('.');
        if (parts.length === 3) {
            try {
                const header = JSON.parse(atob(parts[0]));
                const payload = JSON.parse(atob(parts[1]));
                document.getElementById('jwt-header').textContent = JSON.stringify(header, null, 2);
                document.getElementById('jwt-payload').textContent = JSON.stringify(payload, null, 2);
                document.getElementById('jwt-signature').textContent = parts[2];

                // Render JWT with colors
                const coloredJwt = `<span class="text-green-600">${parts[0]}</span>.<span class="text-yellow-600">${parts[1]}</span>.<span class="text-red-600">${parts[2]}</span>`;
                document.getElementById('jwt-input').innerHTML = coloredJwt;
            } catch (e) {
                document.getElementById('jwt-header').textContent = 'Invalid JSON';
                document.getElementById('jwt-payload').textContent = 'Invalid JSON';
                document.getElementById('jwt-signature').textContent = parts[2];
            }
        } else {
            document.getElementById('jwt-header').textContent = '';
            document.getElementById('jwt-payload').textContent = '';
            document.getElementById('jwt-signature').textContent = '';
        }
    });
</script>
